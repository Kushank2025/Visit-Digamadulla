services:
  mysqldb:
    image: mysql:8.0
    container_name: digamadulla_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: visit_digamadulla_db
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./server
    container_name: digamadulla_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysqldb
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: visit_digamadulla_db
      JWT_SECRET: digamadulla_secret_key_2026
    depends_on:
      - mysqldb

  frontend:
    build: ./client
    container_name: digamadulla_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: